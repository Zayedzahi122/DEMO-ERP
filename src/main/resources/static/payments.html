<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Accounts &mdash; DEMO ERP</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="payments">
  <main class="page-content" id="pageContent"></main>

  <div class="modal fade" id="acctModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="acctForm">
          <div class="modal-header"><h5 class="modal-title" id="acctModalTitle">Add Account</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12"><label class="form-label">Account Name *</label><input class="form-control" id="aName" required placeholder="e.g. Cash on Hand"></div>
              <div class="col-md-6"><label class="form-label">Code</label><input class="form-control" id="aCode" placeholder="e.g. CASH (blank = auto)"></div>
              <div class="col-md-6"><label class="form-label">Type *</label>
                <select class="form-select" id="aType">
                  <option value="CASH">Cash</option>
                  <option value="BANK">Bank</option>
                  <option value="CARD">Card</option>
                  <option value="MOBILE">Mobile Wallet</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="col-12"><label class="form-label">Bank / Provider Details</label><input class="form-control" id="aBank" placeholder="Account number, branch, provider&hellip;"></div>
              <div class="col-md-6"><label class="form-label">Opening Balance (OMR)</label><input class="form-control" id="aOpening" type="number" step="0.001" min="0" value="0"></div>
              <div class="col-md-6"><label class="form-label">Current Balance (OMR)</label><input class="form-control" id="aBalance" type="number" step="0.001" value="0"></div>
              <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="aActive" checked><label class="form-check-label" for="aActive">Active</label></div></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Save Account</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="transferForm">
          <div class="modal-header"><h5 class="modal-title"><i class="bi bi-arrow-left-right me-2 text-primary"></i>Fund Transfer</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12"><label class="form-label">From Account *</label><select class="form-select" id="tfFrom" required></select></div>
              <div class="col-12"><label class="form-label">To Account *</label><select class="form-select" id="tfTo" required></select></div>
              <div class="col-md-6"><label class="form-label">Amount (OMR) *</label><input class="form-control" id="tfAmt" type="number" step="0.001" min="0.001" required></div>
              <div class="col-md-6"><label class="form-label">Date</label><input class="form-control" id="tfDate" type="date"></div>
              <div class="col-12"><label class="form-label">Note</label><input class="form-control" id="tfNote" maxlength="120" placeholder="Optional note"></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Transfer Funds</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/register.js"></script>
  <script src="/js/tenant.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/payments.js"></script>
</body>
</html>
