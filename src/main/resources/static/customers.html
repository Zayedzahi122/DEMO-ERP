<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers &mdash; EDY ERP</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="customers">
  <main class="page-content" id="pageContent"></main>

  <div class="modal fade" id="custModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="custForm">
          <div class="modal-header"><h5 class="modal-title" id="cmTitle">Add Customer</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="cId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Full Name *</label><input class="form-control" id="cName"  placeholder="Enter Full Name" required ></div>
              <div class="col-md-3"><label class="form-label">Phone</label><input class="form-control" id="cPhone" placeholder="+968 9XXX XXXX"></div>
              <div class="col-md-3"><label class="form-label">Email</label><input class="form-control" id="cEmail" type="email" placeholder="customer@email.com"></div>
              <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" id="cAddr" rows="2" placeholder="Street address, Wilayat / City, Oman"></textarea></div>
              <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" id="cNotes" rows="2" placeholder="Customer notes, preferences, credit terms"></textarea></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Save Customer</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Customer Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <input type="file" id="csvImport" accept=".csv" class="d-none">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/tenant.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/customers.js"></script>
</body>
</html>
