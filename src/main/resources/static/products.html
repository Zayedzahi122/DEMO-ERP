<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products &mdash; DEMO ERP</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cat-sidebar { width: 240px; flex-shrink: 0; position: sticky; top: 16px; }
    .cat-item .badge { background: rgba(13,110,253,.12); color: #0d6efd; }
    .cat-item.active .badge { background: rgba(255,255,255,.3); }
  </style>
</head>
<body data-page="products">
  <main class="page-content" id="pageContent"></main>

  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="productForm">
          <div class="modal-header"><h5 class="modal-title" id="pmTitle">Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="pId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Product Name *</label><input class="form-control" id="pName" required></div>
              <div class="col-md-3"><label class="form-label">SKU</label><input class="form-control" id="pSku" placeholder="Auto-generated"></div>
              <div class="col-md-3"><label class="form-label">Barcode</label><input class="form-control" id="pBarcode" placeholder="e.g. 6291041500213"></div>
              <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div>
              <div class="col-md-4"><label class="form-label">Category</label><select class="form-select" id="pCat"></select></div>
              <div class="col-md-4"><label class="form-label">Purchase Price (OMR) *</label><input class="form-control" id="pCost" type="number" step="0.001" min="0" required></div>
              <div class="col-md-4"><label class="form-label">Selling Price (OMR) *</label><input class="form-control" id="pPrice" type="number" step="0.001" min="0" required></div>
              <div class="col-md-4"><label class="form-label">Stock Qty *</label><input class="form-control" id="pStock" type="number" min="0" required></div>
              <div class="col-md-4"><label class="form-label">Min / Reorder Level</label><input class="form-control" id="pReorder" type="number" min="0" value="10"></div>
              <div class="col-md-4"><div><label class="form-label">VAT</label><input class="form-control" value="5%" disabled></div></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Save Product</button></div>
        </form>
      </div>
    </div>
  </div>

  <input type="file" id="csvImport" accept=".csv" class="d-none">

  <div class="modal fade" id="productViewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Product Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="pvBody"></div>
        <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="stockModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Add Opening Stock</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3" id="osInfo"></div>
          <label class="form-label">Quantity to add *</label>
          <input type="number" class="form-control" id="osQty" min="0" step="1" required>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="btnSaveStock"><i class="bi bi-check-lg me-1"></i>Add Stock</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/tenant.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/products.js"></script>
</body>
</html>
