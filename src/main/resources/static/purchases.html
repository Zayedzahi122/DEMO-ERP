<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchases &mdash; DEMO ERP</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="purchases">
  <main class="page-content" id="pageContent"></main>

  <div class="modal fade" id="poModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">New Purchase Order</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Supplier *</label><select class="form-select" id="poSupplier" required></select></div>
            <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="poDate"></div>
            <div class="col-md-3"><label class="form-label">Payment</label><select class="form-select" id="poPayment"><option>CASH</option><option>BANK</option></select></div>
          </div>
          <div class="row g-2 mb-2 align-items-end">
            <div class="col-md-5"><label class="form-label">Product</label><select class="form-select" id="poProduct" class="w-100"></select></div>
            <div class="col-md-2"><label class="form-label">Qty</label><input class="form-control" id="poQty" type="number" min="1" value="1"></div>
            <div class="col-md-3"><label class="form-label">Unit Cost (OMR)</label><input class="form-control" id="poCost" type="number" step="0.001" min="0"></div>
            <div class="col-md-2"><button class="btn btn-soft-primary w-100" id="poAddLine"><i class="bi bi-plus"></i> Add</button></div>
          </div>
          <div id="poLines" class="mb-3"></div>
          <div class="d-flex justify-content-between border-top pt-2"><span class="fw-bold">Subtotal</span><span class="fw-bold" id="poSubtotal">\u2014</span></div>
          <div class="d-flex justify-content-between muted"><span>VAT (5%)</span><span id="poVat">\u2014</span></div>
          <div class="d-flex justify-content-between fw-bold fs-5 mt-1"><span>Total</span><span class="text-primary" id="poTotal">\u2014</span></div>
        </div>
        <div class="modal-footer"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="poSave"><i class="bi bi-check-lg me-1"></i>Create Order</button></div>
      </div>
    </div>
  </div>

  <input type="file" id="csvImport" accept=".csv" class="d-none">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/tenant.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/purchases.js"></script>
</body>
</html>
