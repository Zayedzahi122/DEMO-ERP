<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotations &mdash; DEMO ERP</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="quotations">
  <main class="page-content" id="pageContent"></main>

  <div class="modal fade" id="qModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="qForm">
          <div class="modal-header"><h5 class="modal-title" id="qmTitle">Add Quotation</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-5"><label class="form-label">Customer *</label><select class="form-select" id="qCustomer" required></select></div>
              <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="qDate"></div>
              <div class="col-md-4"><label class="form-label">Valid Until</label><input type="date" class="form-control" id="qValid"></div>
              <div class="col-md-4"><label class="form-label">Product</label><select class="form-select" id="qProduct"></select></div>
              <div class="col-md-2"><label class="form-label">Qty</label><input type="number" class="form-control" id="qQty" value="1" min="1"></div>
              <div class="col-md-4"><label class="form-label">Unit Price</label><input type="number" class="form-control" id="qPrice" step="0.001" min="0"></div>
              <div class="col-md-2 d-flex align-items-end"><button type="button" class="btn btn-primary w-100" id="qAddLine"><i class="bi bi-plus-lg"></i></button></div>
              <div class="col-12">
                <h6 class="fw-bold mb-2">Quote Items</h6>
                <div class="table-wrap"><table class="table table-sm" id="qLines"><thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-end">Price</th><th class="text-end">Total</th><th></th></tr></thead><tbody></tbody></table></div>
              </div>
              <div class="col-md-4"><label class="form-label">Discount</label><input type="number" class="form-control" id="qDiscount" step="0.001" min="0" value="0"></div>
              <div class="col-md-8"><label class="form-label">Notes</label><input class="form-control" id="qNotes"></div>
            </div>
            <div class="row text-end mt-3 fs-14">
              <div class="col-4 offset-6">Subtotal</div><div class="col-2 fw-bold" id="qstSubtotal">0.000</div>
              <div class="col-4 offset-6">VAT (5%)</div><div class="col-2 fw-bold" id="qstVat">0.000</div>
              <div class="col-4 offset-6 fw-bold">Total</div><div class="col-2 fw-bold text-primary fs-5" id="qstTotal">0.000</div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Save Quotation</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="qViewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="qvTitle">Quotation</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="qvBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="qvPrint"><i class="bi bi-printer me-1"></i>Print</button>
          <button type="button" class="btn btn-primary" id="qvConvert"><i class="bi bi-arrow-right-circle me-1"></i>Convert to Sale</button>
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/quotations.js"></script>
</body>
</html>
